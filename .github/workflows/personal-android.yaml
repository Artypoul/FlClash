name: personal Android

on:
  workflow_dispatch:
    inputs:
      subscription_url:
        description: Subscription URL to bundle into the APK
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: personal-android
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.6'
  GO_VERSION: '1.27.1'
  NDK_VERSION: r28c

jobs:
  build:
    name: build personal APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate subscription URL
        shell: bash
        env:
          BOOTSTRAP_SUBSCRIPTION_URL: ${{ inputs.subscription_url }}
        run: |
          set -euo pipefail
          if [[ -z "${BOOTSTRAP_SUBSCRIPTION_URL:-}" ]]; then
            echo 'Missing subscription URL input.' >&2
            exit 1
          fi
          if [[ ! "$BOOTSTRAP_SUBSCRIPTION_URL" =~ ^https?://[^[:space:]]+$ ]]; then
            echo 'Subscription URL must be an HTTP(S) URL.' >&2
            exit 1
          fi
          printf '::add-mask::%s\n' "$BOOTSTRAP_SUBSCRIPTION_URL"

      - name: Install dependencies
        run: flutter pub get

      - name: Verify personal Android defaults and TUN settings
        run: flutter test test/common/personal_defaults_test.dart test/models/tun_test.dart

      - name: Build universal APK
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          BOOTSTRAP_SUBSCRIPTION_URL: ${{ inputs.subscription_url }}
        run: |
          dart setup.dart android --env pre --targets apk --universal-apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flashco-personal-android-${{ github.run_number }}
          path: dist/*android*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Remove generated build inputs
        if: always()
        run: rm -f env.json android/local.properties android/app/keystore.jks
